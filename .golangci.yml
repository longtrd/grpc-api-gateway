version: "2"

run:
  timeout: 10m
  go: '1.24'
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  enable:
    # Error detection
    - errcheck          # Check that error return values are used
    - govet             # Go vet examines Go source code and reports suspicious constructs
    - staticcheck       # Staticcheck is a go vet on steroids, applying tons of static analysis checks
    - unused            # Checks for unused constants, variables, functions and types

    # Bug prevention
    - bodyclose         # Checks whether HTTP response body is closed successfully
    - contextcheck      # Check for missing context parameter in functions
    - errname           # Checks that sentinel errors are prefixed with Err and error types are suffixed with Error
    - errorlint         # Source code analysis to find code that will cause problems with the Go 1.13 error wrapping scheme
    - exhaustive        # Check exhaustiveness of enum switch statements
    - gosec             # Security-oriented linter for Go code
    - nilnil            # Checks that there is no simultaneous return of nil error and nil value
    - noctx             # Finds sending http request without context.Context
    - rowserrcheck      # Checks whether Err of rows is checked successfully
    - sqlclosecheck     # Checks that sql.Rows and sql.Stmt are closed

    # Code quality
    - asasalint         # Check for pass []any as any in variadic func(...any)
    - asciicheck        # Simple linter to check that your code does not contain non-ASCII identifiers
    - bidichk           # Checks for dangerous unicode character sequences
    - copyloopvar       # Copyloopvar is a linter detects places where loop variables are copied
    - dupl              # Tool for code clone detection
    - durationcheck     # Check for two durations multiplied together
    - err113            # Golang linter to check the errors handling expressions
    - gochecknoglobals  # Check that no global variables exist
    - gochecknoinits    # Checks that no init functions are present in Go code
    - goconst           # Finds repeated strings that could be replaced by a constant
    - gocritic          # Provides diagnostics that check for bugs, performance and style issues
    - gocyclo           # Computes and checks the cyclomatic complexity of functions
    - godot             # Check if comments end in a period
    - goheader          # Checks is file header matches to pattern
    - gomoddirectives   # Manage the use of 'replace', 'retract', and 'excludes' directives in go.mod
    - gomodguard        # Allow and block list linter for direct Go module dependencies
    - goprintffuncname  # Checks that printf-like functions are named with f at the end
    - ineffassign       # Detects when assignments to existing variables are not used
    - misspell          # Finds commonly misspelled English words in comments
    - nakedret          # Finds naked returns in functions greater than a specified function length
    - nilerr            # Finds the code that returns nil even if it checks that the error is not nil
    - nilnesserr        # Checks that there is no multiple return when error is not nil
    - nolintlint        # Reports ill-formed or insufficient nolint directives
    - prealloc          # Finds slice declarations that could potentially be pre-allocated
    - predeclared       # Find code that shadows one of Go's predeclared identifiers
    - reassign          # Checks that package variables are not reassigned
    - revive            # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - unconvert         # Remove unnecessary type conversions
    - unparam           # Reports unused function parameters
    - usestdlibvars     # Detect the possibility to use variables/constants from the Go standard library
    - wastedassign      # Finds wasted assignment statements
    - whitespace        # Tool for detection of leading and trailing whitespace

    # Performance
    - fatcontext        # Detects nested contexts in loops
    - makezero          # Finds slice declarations with non-zero initial length
    - perfsprint        # Checks that fmt.Sprintf can be replaced with a faster alternative

    # Style and formatting helpers (not formatters)
    - decorder          # Check declaration order and count of types, constants, variables and functions
    - grouper           # An analyzer to analyze expression groups
    - importas          # Enforces consistent import aliases
    - interfacebloat    # A linter that checks the number of methods in an interface
    - ireturn           # Accept Interfaces, Return Concrete Types
    - lll               # Reports long lines
    - varnamelen        # Checks that the length of a variable's name matches its scope

  settings:
    errcheck:
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    govet:
      enable:
        - shadow
        - fieldalignment

    staticcheck:
      checks:
        - all

    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G204  # Subprocess launched with variable
        - G304  # File path provided as taint input

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - ifElseChain
        - octalLiteral
        - whyNoLint

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    goconst:
      min-len: 2
      min-occurrences: 3

    dupl:
      threshold: 100

    lll:
      line-length: 120

    varnamelen:
      min-name-length: 1
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
        - ok
        - id
        - i
        - j
        - k
        - v
        - t
        - c



formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
