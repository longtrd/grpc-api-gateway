version: '3.8'

# Production override for docker-compose.yml
services:
  grpc-server:
    # Production build optimizations
    build:
      context: ./gRPC-server
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # Security
    read_only: true
    tmpfs:
      - /tmp

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Environment
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - DATABASE_TYPE=memory
      - ENABLE_HEALTH_CHECK=true
      - ENABLE_METRICS=true
      - ENABLE_TRACING=false
      - ENABLE_AUTH=false
      - GRPC_READ_TIMEOUT=30s
      - GRPC_WRITE_TIMEOUT=30s

    # Health check with longer intervals
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

