version: '3.8'

services:
  grpc-server:
    build:
      context: ./gRPC-server
      dockerfile: Dockerfile
    container_name: grpc-server
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - ENVIRONMENT=development
      - DATABASE_TYPE=memory
      - ENABLE_HEALTH_CHECK=true
      - ENABLE_METRICS=false
      - ENABLE_TRACING=false
      - ENABLE_AUTH=false
    restart: unless-stopped
    networks:
      - grpc-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

